<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>AI Insights — FarmDirect</title>
<link rel="stylesheet" href="/css/style.css"></head>
<body>
<nav><a class="logo" href="/">🌾 Farm<span>Direct</span></a>
<ul><li><a href="/">Marketplace</a></li><li><a href="/farmer.html">Sell (Farmers)</a></li>
<li><a href="/buyer.html">🛒 Cart</a></li><li id="authSlot"></li></ul></nav>

<section>
  <h2 class="title">🤖 AI Demand Forecasting</h2>
  <p class="subtitle">Next-month demand per crop — helps farmers decide what to grow</p>
  <div id="forecasts" class="grid"></div>
</section>

<section class="dark">
  <h2 class="title">🚚 Delivery Route Optimizer</h2>
  <p class="subtitle" style="color:#bcd9b0">Nearest-neighbour + 2-opt on today's Nashik delivery stops</p>
  <button class="btn" onclick="optimize()">Optimize Route</button>
  <pre id="routeOut" class="output">Click to run optimization...</pre>
</section>

<script src="/js/app.js"></script>
<script>
(async () => {
  try {
    const data = await api('/api/ai/forecast');
    forecasts.innerHTML = data.map(f => `
      <div class="card"><div class="icon">📈</div><h3>${f.crop}</h3>
      <p><b>Forecast:</b> ${f.forecast ?? '—'} kg</p>
      <p><b>Trend:</b> ${f.trend === 'rising' ? '📈 Rising' : f.trend === 'falling' ? '📉 Falling' : f.trend}</p>
      <p><b>Confidence:</b> ${(f.confidence * 100).toFixed(0)}%</p></div>`).join('');
  } catch (e) { forecasts.innerHTML = `<p style="color:#c00">${e.message}</p>`; }
})();

async function optimize() {
  const out = document.getElementById('routeOut');
  out.textContent = '⏳ Optimizing...';
  const depot = { lat: 19.9975, lng: 73.7898 };
  const stops = [
    { id: 1, lat: 19.88, lng: 74.47 }, { id: 2, lat: 20.01, lng: 73.79 },
    { id: 3, lat: 19.60, lng: 73.75 }, { id: 4, lat: 20.25, lng: 73.95 },
    { id: 5, lat: 19.72, lng: 73.60 }
  ];
  try {
    const r = await api('/api/ai/route', { method: 'POST', body: JSON.stringify({ depot, stops }) });
    out.textContent =
      `📍 Optimized order: ${r.route.map(s => 'Stop#' + s.id).join(' → ')}` +
      `\n🛣️ Total distance: ${r.distance_km} km` +
      `\n🌱 Saved: ${r.saved_km} km (~₹${(r.saved_km * 12).toFixed(0)} fuel, ${(r.saved_km * 0.12).toFixed(1)} kg CO₂)`;
  } catch (e) { out.textContent = '❌ ' + e.message; }
}
</script>
</body>
</html>
