<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Farmer Dashboard — FarmDirect</title>
<link rel="stylesheet" href="/css/style.css"></head>
<body>
<nav><a class="logo" href="/">🌾 Farm<span>Direct</span></a>
<ul><li><a href="/">Marketplace</a></li><li><a href="/admin.html">AI Insights</a></li><li id="authSlot"></li></ul></nav>

<section id="loginGate">
  <h2 class="title">🚜 Farmer Login</h2>
  <div class="modal-box center">
    <input id="lPhone" placeholder="Phone number">
    <input id="lPass" type="password" placeholder="Password">
    <button class="btn" onclick="farmerLogin()">Login</button>
    <p style="color:#777;margin-top:10px">New farmer? <a href="#" onclick="showAuth('register');return false">Register here</a></p>
  </div>
</section>

<section id="dash" style="display:none">
  <h2 class="title">🚜 My Dashboard — <span id="welcome"></span></h2>
  <p class="subtitle">Your earnings = 100% of your listed price. Zero commission.</p>

  <div class="grid2">
    <div class="card">
      <h3>➕ List New Produce</h3>
      <div class="row wrap">
        <input id="crop" placeholder="Crop (e.g. Tomato)">
        <select id="grade"><option>A</option><option>B</option></select>
        <input id="qty" type="number" placeholder="Qty (kg)">
        <input id="price" type="number" step="0.5" placeholder="₹/kg">
        <button class="btn" onclick="listProduce()">List It</button>
      </div>
    </div>
    <div class="card">
      <h3>💰 Total Earnings</h3>
      <h2 id="earnings" style="color:var(--green);font-size:2.2rem">₹0</h2>
      <p id="earnNote">From delivered + accepted orders</p>
    </div>
  </div>

  <h3 style="margin:30px 0 10px">📦 Incoming Orders — accept or reject</h3>
  <div id="orders"></div>

  <h3 style="margin:30px 0 10px">🌿 My Listings</h3>
  <div id="myProduce"></div>
</section>

<script src="/js/app.js"></script>
<script>
async function farmerLogin() {
  try {
    const d = await api('/api/login', { method:'POST', body: JSON.stringify({ phone: lPhone.value, password: lPass.value }) });
    if (d.user.role !== 'farmer') throw new Error('This is a farmer account? Register as buyer on homepage.');
    saveSession(d); init();
  } catch (e) { alert('❌ ' + e.message); }
}

async function init() {
  const u = getUser();
  if (!u || u.role !== 'farmer') return;
  loginGate.style.display = 'none'; dash.style.display = 'block';
  welcome.textContent = u.name + (u.fpo_name ? ` (${u.fpo_name})` : '');
  renderHeader();
  loadOrders(); loadMyProduce();
}

async function listProduce() {
  try {
    await api('/api/produce', { method:'POST', body: JSON.stringify({
      crop: crop.value, grade: grade.value, quantity_kg: +qty.value, price_per_kg: +price.value }) });
    crop.value = qty.value = price.value = '';
    alert('✅ Live on marketplace!'); loadMyProduce();
  } catch (e) { alert('❌ ' + e.message); }
}

async function loadMyProduce() {
  const rows = await api('/api/my-produce');
  myProduce.innerHTML = rows.length ? `<table><tr><th>Crop</th><th>Grade</th><th>Stock</th><th>Your Price</th><th>Mandi Ref</th><th></th></tr>` +
    rows.map(p => `<tr><td>${p.crop}</td><td>${p.grade}</td><td>${p.quantity_kg} kg</td>
      <td>₹${p.price_per_kg}</td><td>₹${p.mandi_price ? p.mandi_price.toFixed(0) : '-'}</td>
      <td><button class="btn sm danger" onclick="delist(${p.id})">Delist</button></td></tr>`).join('') + `</table>`
    : '<p style="color:#777">No listings yet — add your first crop above.</p>';
}
async function delist(id) { await api('/api/produce/' + id, { method:'DELETE' }); loadMyProduce(); }

async function loadOrders() {
  const rows = await api('/api/orders/farmer');
  let earned = 0;
  rows.forEach(o => { if (['accepted','in_transit','delivered'].includes(o.status)) earned += o.total; });
  earnings.textContent = '₹' + Math.round(earned);

  const actions = {
    placed:    `<button class="btn sm" onclick="setStatus(ID,'accepted')">Accept</button>
                <button class="btn sm danger" onclick="setStatus(ID,'rejected')">Reject</button>`,
    accepted:  `<button class="btn sm" onclick="setStatus(ID,'in_transit')">Mark In Transit</button>`,
    in_transit:`<button class="btn sm" onclick="setStatus(ID,'delivered')">Mark Delivered</button>`,
    delivered: '✅ Complete', rejected: '❌ Rejected'
  };
  orders.innerHTML = rows.length ? rows.map(o =>
    `<div class="card orderrow"><b>Order #${o.id}</b> — ${o.qty_kg}kg ${o.crop} = <b class="price">₹${o.total}</b>
      <br><small>👤 ${o.buyer_name} · 📞 ${o.buyer_phone} · 📍 ${o.buyer_location || 'Not specified'}</small>
      <br><span class="status st-${o.status}">${o.status}</span>
      <span class="actions">${(actions[o.status]||'').replaceAll('ID', o.id)}</span></div>`).join('')
    : '<p style="color:#777">No orders yet.</p>';
}
async function setStatus(id, status) {
  await api('/api/orders/' + id + '/status', { method:'PATCH', body: JSON.stringify({ status }) });
  loadOrders();
}
init();
</script>
</body>
</html>
