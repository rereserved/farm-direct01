<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FarmDirect — Buy Direct From Farmers</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
  <a class="logo" href="/">🌾 Farm<span>Direct</span></a>
  <ul>
    <li><a href="/">Marketplace</a></li>
    <li><a href="/farmer.html">Sell (Farmers)</a></li>
    <li><a href="/admin.html">AI Insights</a></li>
    <li id="authSlot"></li>
    <li><a href="/buyer.html">🛒 Cart <span id="cartBadge" class="badge" style="display:none">0</span></a></li>
  </ul>
</nav>

<section class="hero">
  <h1>Buy Directly From <em>Farmers</em></h1>
  <p id="impact" class="subtitle"></p>
</section>

<section>
  <div class="filters">
    <input id="q" placeholder="🔍 Search crop, farmer, location..." oninput="debouncedLoad()">
    <select id="cropFilter" onchange="loadMarket()">
      <option value="">All crops</option>
    </select>
    <select id="sort" onchange="loadMarket()">
      <option value="">Newest</option>
      <option value="rating">Top Rated ⭐</option>
      <option value="price_asc">Price: Low → High</option>
      <option value="price_desc">Price: High → Low</option>
    </select>
  </div>
  <div class="catbar" id="catbar">
    <a href="/" onclick="filterCat('');return false" class="cat active">All</a>
    <a href="/" onclick="filterCat('Vegetables');return false" class="cat">🥦 Vegetables</a>
    <a href="/" onclick="filterCat('Fruits');return false" class="cat">🥭 Fruits</a>
    <a href="/" onclick="filterCat('Grains');return false" class="cat">🌾 Grains</a>
    <a href="/" onclick="filterCat('Oilseeds');return false" class="cat">🫘 Oilseeds</a>
  </div>
  <div id="grid" class="grid"></div>
</section>

<!-- AUTH MODAL -->
<div id="authModal" class="modal" style="display:none">
  <div class="modal-box">
    <h3 id="authTitle">Login</h3>
    <div id="registerFields" style="display:none">
      <input id="rName" placeholder="Full name">
      <select id="rRole"><option value="buyer">I'm a Buyer</option><option value="farmer">I'm a Farmer / FPO</option></select>
      <input id="rFpo" placeholder="FPO name (farmers only)">
      <input id="rLoc" placeholder="District, State">
    </div>
    <input id="aPhone" placeholder="Phone number">
    <input id="aPass" type="password" placeholder="Password">
    <button class="btn" id="authBtn" onclick="doAuth()">Login</button>
    <p style="margin-top:12px">
      <a href="#" id="toggleAuth" onclick="toggleMode();return false">New here? Register</a>
    </p>
    <p id="authErr" style="color:#c00"></p>
    <a href="#" onclick="document.getElementById('authModal').style.display='none';return false" style="float:right">✕ close</a>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/crops.js"></script>
<script>
let mode = 'login';
function toggleMode() {
  mode = mode === 'login' ? 'register' : 'login';
  document.getElementById('authTitle').textContent = mode === 'login' ? 'Login' : 'Register';
  document.getElementById('registerFields').style.display = mode === 'login' ? 'none' : 'block';
  document.getElementById('authBtn').textContent = mode === 'login' ? 'Login' : 'Create Account';
  document.getElementById('toggleAuth').textContent = mode === 'login' ? 'New here? Register' : 'Have an account? Login';
}
async function doAuth() {
  try {
    let data;
    if (mode === 'login')
      data = await api('/api/login', { method:'POST', body: JSON.stringify({ phone: aPhone.value, password: aPass.value }) });
    else
      data = await api('/api/register', { method:'POST', body: JSON.stringify({
        name: rName.value, phone: aPhone.value, password: aPass.value, role: rRole.value,
        fpo_name: rFpo.value, location: rLoc.value }) });
    saveSession(data);
    document.getElementById('authModal').style.display = 'none';
    renderHeader(); refreshCartBadge(); loadMarket();
  } catch (e) { document.getElementById('authErr').textContent = e.message; }
}

let t; function debouncedLoad(){ clearTimeout(t); t = setTimeout(loadMarket, 300); }

async function loadMarket() {
  const params = new URLSearchParams();
  if (q.value) params.set('q', q.value);
  if (cropFilter.value) params.set('crop', cropFilter.value);
  if (sort.value) params.set('sort', sort.value);
  if (catbar.dataset.cat) params.set('cat', catbar.dataset.cat);
  const items = await api('/api/produce?' + params);
  grid.innerHTML = items.length ? items.map(p => `
    <a class="card product" href="/product.html?id=${p.id}" style="text-decoration:none;color:inherit">
      <img src="${cropImg(p.crop)}" alt="${p.crop}" style="width:100%;height:160px;object-fit:cover;border-radius:10px">
      <h3 style="margin-top:10px">${p.crop} <small>(Grade ${p.grade})</small></h3>
      <div class="ratingbar"><span class="stars">${stars(p.rating ? p.rating.avg : 0)}</span>
        <small style="color:#777">${p.rating ? p.rating.avg : 0} (${p.rating ? p.rating.count : 0})</small></div>
      <p class="price">₹${p.price_per_kg}/kg
        <s>₹${p.mandi_price ? p.mandi_price.toFixed(0) : ''}</s>
        <span class="pct" style="font-size:.75rem">${p.mandi_price ? Math.round((1 - p.price_per_kg / p.mandi_price) * 100) : 0}% OFF</span></p>
      <p><small>🚜 ${p.fpo_name || p.farmer_name} · ${p.quantity_kg} kg left</small></p>
      <span class="btn sm" style="display:inline-block;margin-top:8px" onclick="event.preventDefault();addToCart(${p.id})">Add to Cart</span>
    </a>`).join('')
    : '<p style="grid-column:1/-1;text-align:center;color:#777">No produce found.</p>';
  // populate crop filter once
  if (cropFilter.dataset.filled !== '1') {
    const crops = [...new Set(items.map(i => i.crop))];
    crops.forEach(c => cropFilter.add(new Option(c, c)));
    cropFilter.dataset.filled = '1';
  }
}

function filterCat(cat) {
  document.querySelectorAll('.cat').forEach(a => a.classList.remove('active'));
  event.target.classList.add('active');
  catbar.dataset.cat = cat;
  loadMarket();
}

async function addToCart(produce_id, qty = 5) {
  if (!getUser()) { showAuth(); return; }
  if (getUser().role !== 'buyer') { alert('Switch to a Buyer account to shop.'); return; }
  try {
    const qtyVal = document.getElementById('q' + produce_id) ? +document.getElementById('q' + produce_id).value : qty;
    await api('/api/cart', { method:'POST', body: JSON.stringify({ produce_id, qty_kg: qtyVal }) });
    refreshCartBadge();
    alert('Added to cart ✅ — go to 🛒 Cart to checkout');
  } catch (e) { alert('❌ ' + e.message); }
}

async function loadImpact() {
  try {
    const s = await api('/api/impact');
    impact.textContent = `${s.farmers} farmers · ${s.orders} orders · ₹${Math.round(s.farmer_earnings)} paid directly to farmers · ₹${Math.round(s.consumer_savings)} saved by consumers`;
  } catch {}
}
loadMarket(); loadImpact();
if (location.search.includes('auth=register')) showAuth('register');
else if (location.search.includes('auth=login')) showAuth('login');
</script>
</body>
</html>
